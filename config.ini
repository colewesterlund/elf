[buffer]
retention_seconds=30

[rules]
directory=rules

[lists]
directory=lists

[server]
url=http://localhost:8000
poll_interval_seconds=30
# agent_id and auth_token are written by the install script generated by the
# server (Agents -> + Add New Agent). Leave blank on a fresh host.
agent_id=
# auth_token=

[destinations]
siem = file://./output/siem.jsonl
data_lake = file://./output/data_lake.jsonl
alerts = file://./output/alerts.jsonl

# --- Optional: explicit channel subscription list ---
# By default the agent auto-derives the set of Windows event channels to
# subscribe to from the loaded Sigma rules (it maps each rule's
# logsource.service/category to one or more channels and subscribes to the
# union). This keeps the agent's footprint minimal: only channels that at
# least one rule references are watched.
#
# Set `channels` below to override that auto-derivation and subscribe to an
# explicit, fixed list of channels instead. Channel names are Windows event
# log channel paths (case-insensitive). This is useful when you want to
# collect events from channels that no rule references yet (e.g. collecting
# Application logs for future rules), or to force a minimal set for testing.
#
# When this list is non-empty, the agent subscribes to EXACTLY these channels
# (the auto-derived channels from rules are ignored). When empty or omitted,
# the agent auto-derives channels from the rules. Catch-all rules (rules with
# no logsource) always force a full subscribe-all regardless of this setting.
#
# Example (uncomment to use):
# [collect]
# channels = Security, Microsoft-Windows-Sysmon/Operational, Microsoft-Windows-PowerShell/Operational, Windows PowerShell