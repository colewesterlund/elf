title: Brute Force Logon Attempt
id: win_brute_force_logon
status: stable
description: Fires when 5 failed logons (EventID 4625) occur within 60 seconds.
author: ELF
date: 2026-10-01
level: high
tags:
  - attack.credential_access
  - attack.t1110
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  condition: selection
falsepositives:
  - Misconfigured service accounts
  - Users mistyping passwords
elf:
  threshold: 5
  timeframe: 60s
  group_by: TargetUserName
  actions:
    - type: alert
      destination: alerts
      message: "Possible brute-force logon: 5 failed logons within 60s."
    - type: forward_buffer
      destination: siem
