title: Download Piped To Shell
id: lin_curl_pipe_shell
status: stable
description: A shell started with a command line that downloads with curl or wget and pipes the result into sh or bash. Needs the execve audit rule.
author: ELF
date: 2026-10-20
level: high
tags:
  - attack.execution
  - attack.t1059.004
  - attack.command_and_control
  - attack.t1105
logsource:
  product: linux
  category: process_creation
detection:
  selection_shell:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/zsh'
  selection_download:
    CommandLine|contains:
      - 'curl '
      - 'wget '
  selection_pipe:
    CommandLine|contains:
      - '| sh'
      - '| bash'
      - '|sh'
      - '|bash'
  condition: selection_shell and selection_download and selection_pipe
falsepositives:
  - Installers that document this pattern (confirm the source)
elf:
  actions:
    - type: alert
      destination: alerts
      message: "Download piped into a shell."
    - type: forward_buffer
      destination: siem
